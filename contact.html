<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<header><div class="wrap">
  <a class="logo" href="index.html"><img src="images/Logo/logo-light.png" alt="Royal Building Outlets Inc" width="1280" height="633"></a>
  <nav>
    <a href="index.html">Home</a>
    <a href="vinyl.html">Vinyl</a>
    <a href="laminate.html">Laminate</a>
    <div class="dd">
      <a href="cabinets.html">Cabinets</a>
      <div class="menu">
        <a href="cabinets.html#base">Base</a>
        <a href="cabinets.html#wall">Wall</a>
        <a href="cabinets.html#pantry">Pantry</a>
        <a href="cabinets.html#vanity">Vanity</a>
        <a href="cabinets.html#sink-base">Sink Base</a>
        <a href="cabinets.html#corner">Corner</a>
      </div>
    </div>
    <a href="countertops.html">Countertops</a>
    <a href="baseboards.html">Baseboards</a>
    <a href="wall-panels.html">Wall Panels</a>
    <a href="locations.html">Locations</a>
    <a class="here" href="contact.html">Contact</a>
  </nav>
</div></header>

<div class="wrap">
  <section>
    <div class="split">
      <!-- message form -->
      <form class="box" data-contact novalidate>
        <input type="hidden" name="_subject" value="New message from the website">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_captcha" value="false">
        <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">
        <div class="grid g2">
          <div>
            <label class="flabel" for="c-name">Name</label>
            <input class="field" id="c-name" name="name" required autocomplete="name">
          </div>
          <div>
            <label class="flabel" for="c-email">Email</label>
            <input class="field" id="c-email" name="email" type="email" required autocomplete="email">
          </div>
        </div>
        <div class="grid g2">
          <div>
            <label class="flabel" for="c-phone">Phone (optional)</label>
            <input class="field" id="c-phone" name="phone" type="tel" autocomplete="tel">
          </div>
          <div>
            <label class="flabel" for="c-topic">Interested in</label>
            <select class="field" id="c-topic" name="interested_in">
              <option>Vinyl flooring</option><option>Laminate flooring</option><option>Cabinets</option>
              <option>Countertops</option><option>Islands</option><option>Baseboards</option><option>Wall panels</option><option>Not sure yet</option>
            </select>
          </div>
        </div>
        <label class="flabel" for="c-size" id="c-size-label">Square feet needed (optional)</label>
        <input class="field" id="c-size" name="size_needed" type="text" inputmode="decimal" placeholder="e.g. 450" autocomplete="off">
        <div class="fhint" id="c-size-hint">Adding your square footage helps us give you a more accurate estimate.</div>
        <label class="flabel" for="c-msg">Message</label>
        <textarea class="field area" id="c-msg" name="message" required></textarea>
        <button type="submit" class="btn solid txt">Send message</button>
        <div class="form-status" role="status" aria-live="polite"></div>
      </form>

      <!-- direct contact -->
      <div>
        <div class="box"><span class="icon"></span><div class="line m"></div></div><br>
        <div class="box"><span class="icon"></span><div class="line m"></div></div><br>
        <div class="box"><span class="icon"></span><div class="line m"></div><div class="line m"></div><div class="line m"></div></div>
      </div>
    </div>
  </section>
</div>

<footer><div class="wrap"><div class="grid g3">
  <div><a class="logo" href="index.html"><img src="images/Logo/Logo.png" alt="Royal Building Outlets Inc" width="1280" height="633"></a></div>
  <div><div class="line m"></div><div class="line m"></div><div class="line m"></div></div>
  <div><div class="line m"></div><div class="line s"></div><span class="icon"></span> <span class="icon"></span> <span class="icon"></span></div>
</div></div></footer>
<script src="contact-form.js"></script>
<script src="motion.js"></script>
</body></html>
