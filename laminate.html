<div class="wrap">
  <section><div class="img banner" data-img="Wide banner: laminate floor in a finished room"></div></section>

  <!-- selected color: image left, name + description right -->
  <section>
    <div class="colorfeat">
      <div class="img" id="featimg" style="min-height:360px" data-img="Large photo: color 1 laminate in a room"></div>
      <div class="info">
        <span class="tag">14mm</span>
        <div class="line b"></div>
        <div class="line"></div><div class="line"></div><div class="line m"></div><div class="line s"></div>
        <div class="btn solid"></div>
      </div>
    </div>
  </section>

  <div class="divider"></div>

  <!-- all colors -->
  <section>
    <div class="grid g4 colorgrid" id="colorgrid">
      <div class="card on" data-i="1"><div class="img sq" data-img="Color 1: laminate sample"></div><div class="line b"></div></div>
      <div class="card" data-i="2"><div class="img sq" data-img="Color 2: laminate sample"></div><div class="line b"></div></div>
      <div class="card" data-i="3"><div class="img sq" data-img="Color 3: laminate sample"></div><div class="line b"></div></div>
      <div class="card" data-i="4"><div class="img sq" data-img="Color 4: laminate sample"></div><div class="line b"></div></div>
      <div class="card" data-i="5"><div class="img sq" data-img="Color 5: laminate sample"></div><div class="line b"></div></div>
      <div class="card" data-i="6"><div class="img sq" data-img="Color 6: laminate sample"></div><div class="line b"></div></div>
      <div class="card" data-i="7"><div class="img sq" data-img="Color 7: laminate sample"></div><div class="line b"></div></div>
      <div class="card" data-i="8"><div class="img sq" data-img="Color 8: laminate sample"></div><div class="line b"></div></div>
    </div>
  </section>

</div>

<footer><div class="wrap"><div class="grid g3">
  <div><div class="logo"></div></div>
  <div><div class="line m"></div><div class="line m"></div><div class="line m"></div></div>
  <div><div class="line m"></div><div class="line s"></div><span class="icon"></span> <span class="icon"></span> <span class="icon"></span></div>
</div></div></footer>
<div class="chat"></div>

<script>
(function () {
  var cards = document.querySelectorAll('#colorgrid .card');
  var img = document.getElementById('featimg');
  cards.forEach(function (c) {
    c.addEventListener('click', function () {
      cards.forEach(function (x) { x.classList.toggle('on', x === c); });
      img.setAttribute('data-img', 'Large photo: color ' + c.dataset.i + ' laminate in a room');
      img.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
  });
})();
</script>
<script src="motion.js"></script>
</body></html>
