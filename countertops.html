<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wireframe - Countertops</title><link rel="stylesheet" href="style.css"><link rel="icon" type="image/png" href="images/Logo/Logo.png"></head><body>

<header><div class="wrap">
  <a class="logo" href="index.html"><img src="images/Logo/logo-light.png" alt="Royal Building Outlets Inc" width="1280" height="633"></a>
  <nav>
    <a href="index.html">Home</a>
    <a href="vinyl.html">Vinyl</a>
    <a href="laminate.html">Laminate</a>
    <div class="dd">
      <a href="cabinets.html">Cabinets</a>
      <div class="menu">
        <a href="cabinets.html#base">Base</a>
        <a href="cabinets.html#wall">Wall</a>
        <a href="cabinets.html#pantry">Pantry</a>
        <a href="cabinets.html#vanity">Vanity</a>
        <a href="cabinets.html#sink-base">Sink Base</a>
        <a href="cabinets.html#corner">Corner</a>
      </div>
    </div>
    <a class="here" href="countertops.html">Countertops</a>
    <a href="baseboards.html">Baseboards</a>
    <a href="wall-panels.html">Wall Panels</a>
    <a href="locations.html">Locations</a>
    <a href="contact.html">Contact</a>
  </nav>
</div></header>

<div class="wrap">
  <section><div class="img banner" data-img="Wide banner: kitchen island countertop"></div></section>

  <section style="margin-bottom:0">
    <div class="seg" id="ctseg" role="tablist" aria-label="Countertops or islands">
      <button type="button" class="on" data-kind="countertops" role="tab" aria-selected="true">Countertops</button>
      <button type="button" data-kind="islands" role="tab" aria-selected="false">Islands</button>
    </div>
  </section>

  <!-- selected color: image left, name + description right -->
  <section>
    <div class="colorfeat">
      <div class="img" id="featimg" style="min-height:400px" data-img="Large photo: color 1 countertop in a kitchen"></div>
      <div class="info">
        <span class="tag solid">Quartz</span>
        <div class="line b"></div>
        <div class="feat-specs">
          <div class="r"><span>Material</span><span>Quartz</span></div>
          <div class="r"><span id="ctSizeLabel">Size</span><span id="ctSize">26" &times; 110"</span></div>
        </div>
        <a class="btn solid txt" id="estimate" href="contact.html?topic=Countertops">Get an estimate</a>
        <p class="est-hint" id="ctHint">Have your countertop measurements handy. It helps us estimate faster.</p>
      </div>
    </div>
  </section>

  <div class="divider"></div>

  <!-- all colors -->
  <section>
    <div class="grid g4 colorgrid" id="colorgrid">
      <div class="card on" data-i="1"><div class="img sq" data-img="Color 1: countertop slab sample"></div><div class="line b"></div></div>
      <div class="card" data-i="2"><div class="img sq" data-img="Color 2: countertop slab sample"></div><div class="line b"></div></div>
      <div class="card" data-i="3"><div class="img sq" data-img="Color 3: countertop slab sample"></div><div class="line b"></div></div>
      <div class="card" data-i="4"><div class="img sq" data-img="Color 4: countertop slab sample"></div><div class="line b"></div></div>
      <div class="card" data-i="5"><div class="img sq" data-img="Color 5: countertop slab sample"></div><div class="line b"></div></div>
      <div class="card" data-i="6"><div class="img sq" data-img="Color 6: countertop slab sample"></div><div class="line b"></div></div>
      <div class="card" data-i="7"><div class="img sq" data-img="Color 7: countertop slab sample"></div><div class="line b"></div></div>
      <div class="card" data-i="8"><div class="img sq" data-img="Color 8: countertop slab sample"></div><div class="line b"></div></div>
      <div class="card" data-i="9"><div class="img sq" data-img="Color 9: countertop slab sample"></div><div class="line b"></div></div>
      <div class="card" data-i="10"><div class="img sq" data-img="Color 10: countertop slab sample"></div><div class="line b"></div></div>
      <div class="card" data-i="11"><div class="img sq" data-img="Color 11: countertop slab sample"></div><div class="line b"></div></div>
      <div class="card" data-i="12"><div class="img sq" data-img="Color 12: countertop slab sample"></div><div class="line b"></div></div>
    </div>
  </section>

</div>

<footer><div class="wrap"><div class="grid g3">
  <div><a class="logo" href="index.html"><img src="images/Logo/Logo.png" alt="Royal Building Outlets Inc" width="1280" height="633"></a></div>
  <div><div class="line m"></div><div class="line m"></div><div class="line m"></div></div>
  <div><div class="line m"></div><div class="line s"></div><span class="icon"></span> <span class="icon"></span> <span class="icon"></span></div>
</div></div></footer>
<a class="chat" href="contact.html" aria-label="Send us a message"></a>

<script>
(function () {
  var cards = document.querySelectorAll('#colorgrid .card');
  var img = document.getElementById('featimg');
  var buttons = document.querySelectorAll('#ctseg button');
  var kind = 'countertops', color = 1;
  var KINDS = {
    countertops: { photo: 'countertop in a kitchen', size: '26" × 110"', label: 'Size', topic: 'Countertops', hint: 'Have your countertop measurements handy. It helps us estimate faster.' },
    islands:     { photo: 'island in a kitchen',     size: '36" × 110"<br>52" × 110"', label: 'Sizes', topic: 'Islands',     hint: 'Have your island measurements handy. It helps us estimate faster.' }
  };

  function render() {
    var k = KINDS[kind];
    img.setAttribute('data-img', 'Large photo: color ' + color + ' ' + k.photo);
    var size = document.getElementById('ctSize');
    size.innerHTML = k.size;
    document.getElementById('ctSizeLabel').textContent = k.label;
    document.getElementById('ctHint').textContent = k.hint;
    document.getElementById('estimate').href = 'contact.html?topic=' + encodeURIComponent(k.topic);
    buttons.forEach(function (b) {
      var on = b.dataset.kind === kind;
      b.classList.toggle('on', on); b.setAttribute('aria-selected', on);
    });
    cards.forEach(function (c) { c.classList.toggle('on', +c.dataset.i === color); });
  }
  buttons.forEach(function (b) {
    b.addEventListener('click', function () { kind = b.dataset.kind; render(); });   // the colour you picked stays selected
  });
  cards.forEach(function (c) {
    c.addEventListener('click', function () {
      color = +c.dataset.i; render();
      img.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
  });
  render();
})();
</script>
<script src="motion.js"></script>
</body></html>
